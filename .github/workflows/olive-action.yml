name: OLIVE Action Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - feature/olive-action
      - develop
      - master
  workflow_dispatch:
    inputs:
      analyze-only:
        description: "분석만 수행 (아티팩트/코멘트 생략)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  olive-action:
    name: OLIVE Action
    runs-on: kakao-runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OLIVE Action
        uses: kakao/olive-action@v1
        with:
          olive-token: ${{ secrets.OLIVE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
